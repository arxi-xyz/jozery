services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: jozery
      POSTGRES_PASSWORD: jozery
      POSTGRES_DB: jozery
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jozery -d jozery"]
      interval: 2s
      timeout: 5s
      retries: 20

  adminer:
    image: adminer:5
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres

volumes:
  pgdata:
